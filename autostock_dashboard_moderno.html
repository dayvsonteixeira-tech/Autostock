<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AutoStock — Controle de Peças</title>

<style>
:root{
--bg:#f4f5f7;
--surface:#ffffff;
--border:#e2e4e9;
--accent:#2563eb;
--success:#16a34a;
--warn:#d97706;
--danger:#dc2626;
--text:#111827;
--muted:#6b7280;
--radius:10px;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial,sans-serif;
background:var(--bg);
padding:30px;
color:var(--text);
}

.table-wrap{
background:#fff;
border-radius:14px;
overflow:hidden;
box-shadow:0 2px 10px rgba(0,0,0,.08);
}

table{
width:100%;
border-collapse:collapse;
}

th{
background:#f8fafc;
padding:16px;
font-size:13px;
text-transform:uppercase;
color:var(--muted);
text-align:left;
border-bottom:1px solid #e5e7eb;
}

td{
padding:16px;
border-bottom:1px solid #f1f5f9;
}

.badge{
padding:6px 12px;
border-radius:999px;
font-size:12px;
font-weight:bold;
display:inline-block;
}

.badge-ok{
background:#dcfce7;
color:#166534;
}

.badge-low{
background:#fef3c7;
color:#92400e;
}

.badge-critical{
background:#fee2e2;
color:#991b1b;
}

.code{
background:#dbeafe;
padding:6px 10px;
border-radius:8px;
font-weight:bold;
color:#1d4ed8;
font-family:monospace;
}

.badge-cat{
background:#f3f4f6;
padding:6px 10px;
border-radius:8px;
font-size:12px;
}

.qtd-box{
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
padding:10px 14px;
border-radius:12px;
min-width:95px;
}

.qtd-contada{
background:#eff6ff;
border:1px solid #bfdbfe;
}

.qtd-prevista{
background:#fff7ed;
border:1px solid #fed7aa;
}

.qtd-label{
font-size:11px;
text-transform:uppercase;
letter-spacing:.05em;
color:var(--muted);
margin-bottom:5px;
font-weight:700;
}

.qtd-value{
font-size:22px;
font-weight:700;
font-family:monospace;
}

.diff-box{
padding:12px 16px;
border-radius:12px;
font-weight:700;
font-family:monospace;
text-align:center;
min-width:75px;
font-size:16px;
}

.diff-positive{
background:#f0fdf4;
color:#15803d;
border:1px solid #bbf7d0;
}

.diff-negative{
background:#fef2f2;
color:#b91c1c;
border:1px solid #fecaca;
}

.diff-neutral{
background:#f3f4f6;
color:#4b5563;
border:1px solid #d1d5db;
}

.btn{
background:var(--accent);
color:white;
border:none;
padding:10px 14px;
border-radius:10px;
cursor:pointer;
font-weight:bold;
}

.metric-title{
font-size:28px;
font-weight:bold;
margin-bottom:20px;
}
</style>
</head>

<body>

<div class="metric-title">
Dashboard de Estoque
</div>

<div class="table-wrap">
<table>

<thead>
<tr>
<th>Status</th>
<th>Código</th>
<th>Peça</th>
<th>Categoria</th>
<th>QTD Contada</th>
<th>QTD Prevista</th>
<th>Diferença</th>
<th>Ação</th>
</tr>
</thead>

<tbody>

<tr>

<td>
<span class="badge badge-critical">
🔴 Crítico
</span>
</td>

<td>
<span class="code">BP-0421</span>
</td>

<td>
Pastilha de Freio
</td>

<td>
<span class="badge-cat">
Freios
</span>
</td>

<td>
<div class="qtd-box qtd-contada">
<span class="qtd-label">Contada</span>
<span class="qtd-value">3</span>
</div>
</td>

<td>
<div class="qtd-box qtd-prevista">
<span class="qtd-label">Prevista</span>
<span class="qtd-value">10</span>
</div>
</td>

<td>
<div class="diff-box diff-negative">
-7
</div>
</td>

<td>
<button class="btn">
+ Entrada
</button>
</td>

</tr>

<tr>

<td>
<span class="badge badge-low">
🟡 Baixo
</span>
</td>

<td>
<span class="code">EL-1020</span>
</td>

<td>
Sensor ABS
</td>

<td>
<span class="badge-cat">
Elétrica
</span>
</td>

<td>
<div class="qtd-box qtd-contada">
<span class="qtd-label">Contada</span>
<span class="qtd-value">12</span>
</div>
</td>

<td>
<div class="qtd-box qtd-prevista">
<span class="qtd-label">Prevista</span>
<span class="qtd-value">15</span>
</div>
</td>

<td>
<div class="diff-box diff-negative">
-3
</div>
</td>

<td>
<button class="btn">
+ Entrada
</button>
</td>

</tr>

<tr>

<td>
<span class="badge badge-ok">
🟢 OK
</span>
</td>

<td>
<span class="code">MT-5001</span>
</td>

<td>
Correia Dentada
</td>

<td>
<span class="badge-cat">
Motor
</span>
</td>

<td>
<div class="qtd-box qtd-contada">
<span class="qtd-label">Contada</span>
<span class="qtd-value">20</span>
</div>
</td>

<td>
<div class="qtd-box qtd-prevista">
<span class="qtd-label">Prevista</span>
<span class="qtd-value">20</span>
</div>
</td>

<td>
<div class="diff-box diff-neutral">
0
</div>
</td>

<td>
<button class="btn">
+ Entrada
</button>
</td>

</tr>

</tbody>

</table>
</div>

</body>
</html>
